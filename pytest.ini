[pytest]
# Only the shared protocol package and the cross-component integration suite live here. The two
# deploy units keep their own pytest.ini, so each can be tested on its own machine without this
# file — ``scripts/test.sh`` runs all three.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths =
    packages/pa-protocol/tests
    tests
filterwarnings =
    error::DeprecationWarning:agent_core.*
    error::DeprecationWarning:telegram_gateway.*
markers =
    real_cursor: hits the real Cursor Agent; skipped unless PA_REAL_CURSOR_TESTS=1
    slow: takes more than a few seconds
