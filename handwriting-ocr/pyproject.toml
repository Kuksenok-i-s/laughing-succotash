[project]
name = "handwriting-ocr"
version = "1.0.0"
description = "Handwriting OCR service: two-pass Qwen3-VL via Ollama behind an HTTP API"
requires-python = ">=3.12"
dependencies = ["Pillow==12.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
handwriting-ocr = "handwriting_ocr.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["handwriting_ocr"]
