[project]
name = "telegram-gateway"
version = "1.0.0"
description = "Telegram Gateway: transport adapter between Telegram and the Agent Core"
requires-python = ">=3.12"
dependencies = [
    "pa-protocol",
    "aiogram==3.31.0",
    "aiohttp==3.14.3",
    "aiofiles==25.1.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
telegram-gateway = "telegram_gateway.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telegram_gateway"]

[tool.hatch.metadata]
allow-direct-references = true
