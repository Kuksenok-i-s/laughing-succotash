[project]
name = "gpu-transcriber"
version = "1.0.0"
description = "Transcription service: HTTP API in front of a warm faster-whisper model"
requires-python = ">=3.12"
dependencies = ["faster-whisper==1.2.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gpu-transcriber = "gpu_transcriber.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpu_transcriber"]
