# TLS termination for the Gateway's RPC endpoint.
#
# The Core connects with wss:// and verifies the certificate normally, which is the entire
# transport security model — no VPN, no mTLS, no reverse tunnel. Get a real certificate
# (certbot --nginx) and this is enough.

server {
    listen 443 ssl http2;
    server_name gateway.example.com;

    ssl_certificate     /etc/letsencrypt/live/gateway.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /rpc {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The link is long-lived and mostly idle between messages. Without these, nginx closes it
        # every 60 seconds and the Core reconnects for no reason. Application-level pings keep it
        # genuinely alive; this just stops nginx from second-guessing them.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Audio arrives as binary WebSocket frames rather than uploads, so no body limit applies —
        # but buffering a multi-hour recording would defeat the point of streaming it.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # Nothing else is served here.
    location / {
        return 404;
    }
}
