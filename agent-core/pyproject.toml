[project]
name = "agent-core"
version = "1.0.0"
description = "Agent Core: Cursor Agent, local Whisper, MCP tools, scheduler and memory"
requires-python = ">=3.12"
dependencies = [
    "pa-protocol",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "aiohttp==3.14.3",
    "websockets==17.1",
    "python-dateutil==2.9.0.post0",
    "tzdata==2026.3",
]

[project.optional-dependencies]
# Whisper is a heavy, platform-specific install (CTranslate2 wheels). It is separate so the Core
# can be developed and unit-tested on any machine, while only the Mac mini installs it.
stt = ["faster-whisper==1.2.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
agent-core = "agent_core.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_core"]

[tool.hatch.metadata]
# pa-protocol is a path dependency inside this repository.
allow-direct-references = true
